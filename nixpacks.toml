# Railway Nixpacks build configuration (same as the Zomato project)
# https://nixpacks.com/docs/config

[phases.setup]
nixPkgs = ["python312", "python312Packages.pip"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
# Single worker: the in-process APScheduler must run exactly once.
cmd = "uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1"
